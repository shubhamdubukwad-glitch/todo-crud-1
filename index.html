<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

    <title>firebase todo crud-1</title>

<body>
    <h2 class="bg-primary text-black text-center">FireBase Todo Crud Crud-1</h2>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h4 class="bg-primary text-black text-center">Todo Input..!!</h4>
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="inputControl">TODO-INPUT</label>
                                <input type="text" class="form-control" id="inputControl">
                            </div>
                            <button id="addtodoBtn" class="btn btn-outline-primary btn-block">Add Todo</button>
                            <button id="updatetodoBtn" type="button"
                                class="btn btn-outline-success btn-block d-none">Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h3 class="bg-primary text-black text-center">todo list..!!</h3>
                        <ul class="list-group" id="todocontainer">

                                <div>
                                    <i class="fa-regular fa-pen-to-square fa-2x text-primary"></i>
                                    <i class="fa-solid fa-trash fa-2x text-danger"></i>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
